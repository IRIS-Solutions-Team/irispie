#
# Run tests, bump version, create tag and release, and notify edition
# repositories
#

name: Test and version

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit


  version-bump:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.bump-version.outputs.new-version }}

    steps:
      - name: Checkout irispie/develop
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop
          path: irispie
          token: ${{ secrets.IRIS_SOLUTIONS_TEAM_TOKEN_2026 }}
          repository: IRIS-Solutions-Team/irispie

      - name: Set up identity
        working-directory: irispie
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies for version bumping
        run: |
          pip install toml

      - name: Bump version in pyproject.toml
        id: bump-version
        working-directory: irispie
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          python ./.github/workflows/bump_version.py --release-type=$RELEASE_TYPE
          NEW_VERSION=$(python ./.github/workflows/print_version.py)
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push new version to develop
        env:
            version: ${{ steps.bump-version.outputs.new-version }}
        working-directory: irispie
        run: |
          git switch develop
          git add ./pyproject.toml
          git commit -m "Bump version to $version"
          git tag $version
          git push origin develop --tags

      - name: Create release
        id: create-release
        env:
          version: ${{ steps.bump-version.outputs.new-version }}
          # gh picks the token from GITHUB_TOKEN env variable automatically
          GITHUB_TOKEN: ${{ secrets.IRIS_SOLUTIONS_TEAM_TOKEN_2026 }}
        working-directory: irispie
        run: |
            gh release create "$version" \
              --title "Release $version" \
              --notes ""


  broadcast-release:
    needs: version-bump
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: [irispie-ce, irispie-re, irispie-pe]

    steps:
      - name: Repository dispatch to ${{ matrix.repository }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.IRIS_SOLUTIONS_TEAM_TOKEN_2026 }}
          repository: IRIS-Solutions-Team/${{ matrix.repository }}
          event-type: new-release

